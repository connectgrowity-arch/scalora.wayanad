<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Scalora CMS — Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0B0A0F',
            brand: '#5C6CFF',
            card: '#13121a',
            surface: '#181722',
            border: 'rgba(255, 255, 255, 0.1)',
            ink: '#F4F3F8',
            mut: '#9a98a8',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'Sora', 'system-ui', 'sans-serif'],
            heading: ['"Space Grotesk"', 'Sora', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'Manrope', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- React 18, ReactDOM and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0B0A0F; color: #F4F3F8; font-family: 'Inter', 'Manrope', sans-serif; }
    h1, h2, h3 { font-family: 'Space Grotesk', 'Sora', sans-serif; }
    input, textarea, select {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #5C6CFF;
      box-shadow: 0 0 0 2px rgba(92, 108, 255, 0.25);
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0B0A0F; }
    ::-webkit-scrollbar-thumb { background: #262535; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #5C6CFF; }
  </style>
</head>
<body class="min-h-screen bg-bg text-ink flex">
  <div id="admin-root" class="w-full flex min-h-screen"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_CMS_DATA = {
      settings: {
        siteTitle: "Scalora: Digital Presence, Scaled | Web Design, Social Media & Brand Growth Agency",
        siteDescription: "Scalora builds high-converting websites, manages social media channels, and designs iconic brands so your business is seen, followed and chosen. Get a free digital audit today.",
        keywords: "digital presence, web design agency, social media management, brand design, performance advertising, digital marketing growth, SEO services, Scalora",
        canonicalUrl: "https://scalora.agency/",
        ogImage: "/assets/logo.jpg",
        brandName: "Scalora",
        contactEmail: "hello@scalora.com",
        primaryColor: "#5C6CFF",
        backgroundColor: "#0B0A0F"
      },
      hero: {
        headline: "Digital presence, scaled.",
        subheading: "Scalora builds your website, runs your social media and designs your brand, so more of the right people find you, follow you and choose you.",
        primaryCta: "Get a free audit",
        secondaryCta: "See what we do",
        platforms: ["Facebook", "Instagram", "LinkedIn", "YouTube", "Google"]
      },
      marquee: ["Websites", "Social media", "Design", "Video", "Ads"],
      story: [
        { headline: "Seen.", description: "Your website, search and profiles work together so people can find you." },
        { headline: "Followed.", description: "Consistent content and short video turn visitors into a community." },
        { headline: "Chosen.", description: "Reviews, results and a clear offer make you the obvious choice." }
      ],
      services: [
        { id: "audit", tag: "Start here", title: "Digital audit", description: "We review your website, search, profiles and competitors, then tell you what to fix first.", platforms: [] },
        { id: "websites", tag: "Build", title: "Websites", description: "Fast, mobile-first sites that make it easy to call, book or buy.", platforms: [] },
        { id: "social", tag: "Platforms", title: "Social media", description: "Profiles set up and branded so you look like one company everywhere.", platforms: ["Facebook", "Instagram", "LinkedIn", "YouTube"] },
        { id: "branding", tag: "Look", title: "Design and branding", description: "Logo, colours, templates, posts and ads people recognise at a glance.", platforms: [] },
        { id: "management", tag: "Every day", title: "Social media management", description: "Posts and short videos made and published for you, with replies and a monthly report.", platforms: [] },
        { id: "ads", tag: "Scale", title: "Ads and growth", description: "Paid campaigns on Meta, Google and YouTube, tracked to enquiries and sales.", platforms: [] }
      ],
      process: [
        { title: "Analyse", description: "We audit your digital footprint and your competitors." },
        { title: "Plan", description: "A simple roadmap with priorities, timing and cost." },
        { title: "Build", description: "Website, profiles and content, launched together." },
        { title: "Grow", description: "We manage, measure and improve every month." }
      ],
      scoreOptions: ["Mobile-friendly website", "Google Business profile", "Weekly Instagram posts", "Active Facebook page", "LinkedIn page", "Video on YouTube or Reels", "Consistent brand look"],
      posts: [
        { id: "post-1", tag: "Search", title: "People ask AI, not just Google.", description: "Answer engines and social search favour clear, expert content. We structure yours to be found and quoted.", date: "2026-11-01" },
        { id: "post-2", tag: "Video", title: "Short vertical video leads.", description: "Reels, Shorts and TikTok drive most social attention, so we plan, shoot and edit it for you.", date: "2026-10-28" },
        { id: "post-3", tag: "Commerce", title: "Social is a shop.", description: "Customers discover, compare and buy inside the app, often within minutes.", date: "2026-10-24" },
        { id: "post-4", tag: "AI at work", title: "Faster, with humans in charge.", description: "AI speeds up research and drafts. Our team keeps your voice and the judgment.", date: "2026-10-18" },
        { id: "post-5", tag: "Creators", title: "Small voices, real trust.", description: "Micro-creators often earn more trust than big names.", date: "2026-10-12" },
        { id: "post-6", tag: "Privacy", title: "Own your audience.", description: "As tracking rules tighten, email, WhatsApp and first-party data matter more.", date: "2026-10-05" }
      ],
      inquiries: []
    };

    function AdminApp() {
      const [content, setContent] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState('');
      const [saving, setSaving] = useState(false);
      const [isStaticMode, setIsStaticMode] = useState(false);

      // Fetch current content from server API, falling back to localStorage / static JSON / built-in defaults
      useEffect(() => {
        fetch('/api/content')
          .then(res => {
            if (!res.ok) throw new Error('API unavailable');
            return res.json();
          })
          .then(data => {
            setContent(data);
            setIsStaticMode(false);
            setLoading(false);
          })
          .catch(() => {
            setIsStaticMode(true);
            const saved = localStorage.getItem('scalora_cms_content');
            if (saved) {
              try {
                setContent(JSON.parse(saved));
                setLoading(false);
                return;
              } catch {}
            }
            fetch('./data/site-content.json')
              .then(r => {
                if (!r.ok) throw new Error('JSON unavailable');
                return r.json();
              })
              .then(data => {
                setContent(data);
                setLoading(false);
              })
              .catch(() => {
                setContent(DEFAULT_CMS_DATA);
                setLoading(false);
              });
          });
      }, []);

      const showToast = msg => {
        setToast(msg);
        setTimeout(() => setToast(''), 4000);
      };

      const handleExportJson = () => {
        if (!content) return;
        const blob = new Blob([JSON.stringify(content, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'site-content.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Downloaded site-content.json! Commit to GitHub to update static site.');
      };

      const handleSave = () => {
        if (!content) return;
        setSaving(true);
        localStorage.setItem('scalora_cms_content', JSON.stringify(content));
        if (isStaticMode) {
          setSaving(false);
          showToast('Saved to browser storage (Static Mode). Export JSON to commit to GitHub!');
          return;
        }
        fetch('/api/content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(content, null, 2)
        })
          .then(res => {
            if (!res.ok) throw new Error('Save failed');
            return res.json();
          })
          .then(() => {
            setSaving(false);
            showToast('Changes published to live website!');
          })
          .catch(() => {
            setSaving(false);
            setIsStaticMode(true);
            showToast('Saved locally! Use Export JSON to commit changes to GitHub.');
          });
      };

      if (loading) {
        return (
          <div className="flex-1 flex items-center justify-center h-screen bg-bg">
            <div className="flex flex-col items-center gap-4">
              <div className="w-10 h-10 border-4 border-brand border-t-transparent rounded-full animate-spin"></div>
              <p className="text-mut text-sm font-semibold">Loading Scalora CMS...</p>
            </div>
          </div>
        );
      }

      if (!content) {
        return (
          <div className="flex-1 p-10 text-center">
            <h2 className="text-xl text-red-400">Failed to load CMS data.</h2>
            <p className="text-mut mt-2">Ensure server is running at http://localhost:3000</p>
          </div>
        );
      }

      return (
        <div className="w-full flex min-h-screen">
          {/* WordPress-Style Dark Sidebar */}
          <aside className="w-64 bg-[#100F17] border-r border-white/10 flex flex-col shrink-0">
            {/* CMS Brand Header */}
            <div className="h-16 border-b border-white/10 px-6 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-brand flex items-center justify-center font-extrabold text-white text-lg shadow-[0_0_15px_#5C6CFF88]">
                  S
                </div>
                <div>
                  <h1 className="font-bold text-base text-white tracking-tight leading-none">Scalora<span className="text-brand">CMS</span></h1>
                  <span className="text-[10px] text-mut uppercase font-semibold tracking-wider">WP Studio Edition</span>
                </div>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="p-3 space-y-1 text-sm font-medium flex-1 overflow-y-auto">
              <button
                onClick={() => setActiveTab('dashboard')}
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors ${
                  activeTab === 'dashboard' ? 'bg-brand text-white font-semibold shadow-md' : 'text-mut hover:text-white hover:bg-white/5'
                }`}
              >
                <span>📊</span> Dashboard
              </button>

              <div className="pt-4 pb-1.5 px-3.5 text-[11px] font-bold uppercase tracking-wider text-mut/60">Content & Sections</div>

              <button
                onClick={() => setActiveTab('hero')}
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors ${
                  activeTab === 'hero' ? 'bg-brand text-white font-semibold' : 'text-mut hover:text-white hover:bg-white/5'
                }`}
              >
                <span>🏠</span> Hero & Header
              </button>

              <button
                onClick={() => setActiveTab('services')}
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors ${
                  activeTab === 'services' ? 'bg-brand text-white font-semibold' : 'text-mut hover:text-white hover:bg-white/5'
                }`}
              >
                <span>💼</span> Services ({content.services?.length || 0})
              </button>

              <button
                onClick={() => setActiveTab('story')}
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors ${
                  activeTab === 'story' ? 'bg-brand text-white font-semibold' : 'text-mut hover:text-white hover:bg-white/5'
                }`}
              >
                <span>📖</span> Brand Story (Seen/Chosen)
              </button>

              <button
                onClick={() => setActiveTab('process')}
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors ${
                  activeTab === 'process' ? 'bg-brand text-white font-semibold' : 'text-mut hover:text-white hover:bg-white/5'
                }`}
              >
                <span>📈</span> 4-Step Process
              </button>

              <div className="pt-4 pb-1.5 px-3.5 text-[11px] font-bold uppercase tracking-wider text-mut/60">Blog & Leads</div>

              <button
                onClick={() => setActiveTab('posts')}
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors ${
                  activeTab === 'posts' ? 'bg-brand text-white font-semibold' : 'text-mut hover:text-white hover:bg-white/5'
                }`}
              >
                <span>✍️</span> Posts & Insights ({content.posts?.length || 0})
              </button>

              <button
                onClick={() => setActiveTab('leads')}
                className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl transition-colors ${
                  activeTab === 'leads' ? 'bg-brand text-white font-semibold' : 'text-mut hover:text-white hover:bg-white/5'
                }`}
              >
                <div className="flex items-center gap-3">
                  <span>📬</span> Leads / Inquiries
                </div>
                {content.inquiries?.length > 0 && (
                  <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">
                    {content.inquiries.length}
                  </span>
                )}
              </button>

              <div className="pt-4 pb-1.5 px-3.5 text-[11px] font-bold uppercase tracking-wider text-mut/60">System</div>

              <button
                onClick={() => setActiveTab('media')}
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors ${
                  activeTab === 'media' ? 'bg-brand text-white font-semibold' : 'text-mut hover:text-white hover:bg-white/5'
                }`}
              >
                <span>🖼️</span> Media Library
              </button>

              <button
                onClick={() => setActiveTab('settings')}
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-colors ${
                  activeTab === 'settings' ? 'bg-brand text-white font-semibold' : 'text-mut hover:text-white hover:bg-white/5'
                }`}
              >
                <span>⚙️</span> Site Settings
              </button>
            </nav>

            {/* Sidebar Footer */}
            <div className="p-4 border-t border-white/10 text-xs text-mut/80 space-y-2">
              <div className="flex items-center gap-2 text-[11px] font-semibold">
                <span className={`w-2 h-2 rounded-full ${isStaticMode ? 'bg-amber-400' : 'bg-emerald-400'}`}></span>
                <span>{isStaticMode ? 'Static / GitHub Pages Mode' : 'Local Server API Connected'}</span>
              </div>
              <a href="./" target="_blank" className="flex items-center gap-2 text-white hover:text-brand font-semibold transition-colors">
                <span>↗</span> Open Live Website
              </a>
            </div>
          </aside>

          {/* Main Workspace */}
          <div className="flex-1 flex flex-col min-w-0 bg-bg">
            {/* Top Bar */}
            <header className="h-16 bg-[#13121a] border-b border-white/10 px-8 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-4">
                <span className="text-mut text-sm">Scalora Dashboard /</span>
                <span className="font-semibold text-white capitalize">{activeTab}</span>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={handleExportJson}
                  title="Download site-content.json for GitHub"
                  className="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2 border border-white/20 rounded-lg hover:border-brand text-white transition-colors"
                >
                  ⬇ Export JSON
                </button>

                <a
                  href="./"
                  target="_blank"
                  className="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold px-4 py-2 border border-white/20 rounded-lg hover:border-white/50 text-white transition-colors"
                >
                  View Website ↗
                </a>

                <button
                  onClick={handleSave}
                  disabled={saving}
                  className="bg-brand text-white font-semibold text-sm px-6 py-2 rounded-xl transition-all hover:bg-opacity-90 shadow-[0_4px_16px_#5C6CFF66] flex items-center gap-2 disabled:opacity-50"
                >
                  {saving ? (
                    <>
                      <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                      <span>Saving...</span>
                    </>
                  ) : (
                    <>
                      <span>💾</span> Save & Publish
                    </>
                  )}
                </button>
              </div>
            </header>

            {/* Toast Notification */}
            {toast && (
              <div className="fixed top-20 right-8 z-50 bg-[#1e1c2b] border border-brand text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all animate-bounce">
                <span className="text-brand text-lg">✓</span>
                <span className="text-sm font-medium">{toast}</span>
              </div>
            )}

            {/* Tab Content Panels */}
            <main className="flex-1 p-6 sm:p-10 overflow-y-auto max-w-5xl w-full">
              {activeTab === 'dashboard' && (
                <div className="space-y-8">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Welcome back to Scalora CMS</h2>
                    <p className="text-mut text-sm mt-1">Manage all pages, copy, services, media, and inbound leads in real time.</p>
                  </div>

                  {/* Stat Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    <div className="bg-card border border-white/10 p-5 rounded-2xl">
                      <div className="text-mut text-xs font-bold uppercase tracking-wider">Services Active</div>
                      <div className="text-3xl font-extrabold text-white mt-2">{content.services?.length || 0}</div>
                      <div className="text-xs text-brand mt-1">Live on homepage</div>
                    </div>

                    <div className="bg-card border border-white/10 p-5 rounded-2xl">
                      <div className="text-mut text-xs font-bold uppercase tracking-wider">Inquiries & Leads</div>
                      <div className="text-3xl font-extrabold text-white mt-2">{content.inquiries?.length || 0}</div>
                      <div className="text-xs text-emerald-400 mt-1">Ready in CRM</div>
                    </div>

                    <div className="bg-card border border-white/10 p-5 rounded-2xl">
                      <div className="text-mut text-xs font-bold uppercase tracking-wider">Published Posts</div>
                      <div className="text-3xl font-extrabold text-white mt-2">{content.posts?.length || 0}</div>
                      <div className="text-xs text-mut mt-1">Industry trends</div>
                    </div>

                    <div className="bg-card border border-white/10 p-5 rounded-2xl">
                      <div className="text-mut text-xs font-bold uppercase tracking-wider">System Status</div>
                      <div className="text-3xl font-extrabold text-emerald-400 mt-2">100%</div>
                      <div className="text-xs text-mut mt-1">Vite + React Core</div>
                    </div>
                  </div>

                  {/* Quick Actions */}
                  <div className="bg-card border border-white/10 p-6 rounded-2xl space-y-4">
                    <h3 className="font-bold text-white text-base">Quick Shortcuts</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <button onClick={()=>setActiveTab('services')} className="p-4 bg-white/[0.03] hover:bg-white/[0.07] border border-white/10 rounded-xl text-left transition-colors">
                        <div className="text-lg">💼</div>
                        <div className="font-semibold text-white mt-2 text-sm">Add New Service</div>
                        <div className="text-xs text-mut mt-1">Update offerings & packages</div>
                      </button>

                      <button onClick={()=>setActiveTab('leads')} className="p-4 bg-white/[0.03] hover:bg-white/[0.07] border border-white/10 rounded-xl text-left transition-colors">
                        <div className="text-lg">📬</div>
                        <div className="font-semibold text-white mt-2 text-sm">View Lead Submissions</div>
                        <div className="text-xs text-mut mt-1">Follow up with prospective clients</div>
                      </button>

                      <button onClick={()=>setActiveTab('hero')} className="p-4 bg-white/[0.03] hover:bg-white/[0.07] border border-white/10 rounded-xl text-left transition-colors">
                        <div className="text-lg">✏️</div>
                        <div className="font-semibold text-white mt-2 text-sm">Edit Hero Copy</div>
                        <div className="text-xs text-mut mt-1">Refine headline & subhead</div>
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Hero & Branding Tab */}
              {activeTab === 'hero' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Hero Section Editor</h2>
                    <p className="text-mut text-sm mt-1">Control main hero headline, subtext, call-to-actions, and platform badges.</p>
                  </div>

                  <div className="bg-card border border-white/10 p-6 rounded-2xl space-y-5">
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Main Headline</label>
                      <input
                        type="text"
                        className="w-full text-lg font-bold"
                        value={content.hero.headline}
                        onChange={e => setContent({ ...content, hero: { ...content.hero, headline: e.target.value } })}
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Subheading / Description</label>
                      <textarea
                        rows={3}
                        className="w-full text-base"
                        value={content.hero.subheading}
                        onChange={e => setContent({ ...content, hero: { ...content.hero, subheading: e.target.value } })}
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Primary CTA Button</label>
                        <input
                          type="text"
                          className="w-full"
                          value={content.hero.primaryCta}
                          onChange={e => setContent({ ...content, hero: { ...content.hero, primaryCta: e.target.value } })}
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Secondary CTA Button</label>
                        <input
                          type="text"
                          className="w-full"
                          value={content.hero.secondaryCta}
                          onChange={e => setContent({ ...content, hero: { ...content.hero, secondaryCta: e.target.value } })}
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Platform Badges (comma separated)</label>
                      <input
                        type="text"
                        className="w-full"
                        value={content.hero.platforms?.join(', ')}
                        onChange={e => setContent({
                          ...content,
                          hero: {
                            ...content.hero,
                            platforms: e.target.value.split(',').map(s => s.trim()).filter(Boolean)
                          }
                        })}
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* Services Manager Tab */}
              {activeTab === 'services' && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-2xl font-bold text-white">Services Manager</h2>
                      <p className="text-mut text-sm mt-1">Add, edit, or remove the core service cards shown on the homepage.</p>
                    </div>

                    <button
                      onClick={() => {
                        const newService = {
                          id: 'service-' + Date.now(),
                          tag: 'New',
                          title: 'New Service Offering',
                          description: 'Description of what this service delivers for clients.',
                          platforms: []
                        };
                        setContent({ ...content, services: [...content.services, newService] });
                      }}
                      className="bg-brand text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-opacity-90 flex items-center gap-1.5"
                    >
                      <span>+</span> Add Service
                    </button>
                  </div>

                  <div className="space-y-4">
                    {content.services.map((svc, idx) => (
                      <div key={svc.id || idx} className="bg-card border border-white/10 p-5 rounded-2xl space-y-4">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-brand uppercase tracking-wider">Service #{idx + 1}</span>
                          <button
                            onClick={() => {
                              const updated = content.services.filter((_, i) => i !== idx);
                              setContent({ ...content, services: updated });
                            }}
                            className="text-xs text-red-400 hover:text-red-300 font-semibold"
                          >
                            ✕ Remove
                          </button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs text-mut mb-1">Tag / Category</label>
                            <input
                              type="text"
                              className="w-full text-sm font-semibold text-brand"
                              value={svc.tag}
                              onChange={e => {
                                const next = [...content.services];
                                next[idx].tag = e.target.value;
                                setContent({ ...content, services: next });
                              }}
                            />
                          </div>

                          <div className="sm:col-span-2">
                            <label className="block text-xs text-mut mb-1">Service Title</label>
                            <input
                              type="text"
                              className="w-full text-sm font-bold text-white"
                              value={svc.title}
                              onChange={e => {
                                const next = [...content.services];
                                next[idx].title = e.target.value;
                                setContent({ ...content, services: next });
                              }}
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs text-mut mb-1">Description</label>
                          <textarea
                            rows={2}
                            className="w-full text-sm"
                            value={svc.description}
                            onChange={e => {
                              const next = [...content.services];
                              next[idx].description = e.target.value;
                              setContent({ ...content, services: next });
                            }}
                          />
                        </div>

                        <div>
                          <label className="block text-xs text-mut mb-1">Platform tags (optional, comma-separated)</label>
                          <input
                            type="text"
                            className="w-full text-xs"
                            placeholder="e.g. Facebook, Instagram, LinkedIn"
                            value={svc.platforms?.join(', ') || ''}
                            onChange={e => {
                              const next = [...content.services];
                              next[idx].platforms = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
                              setContent({ ...content, services: next });
                            }}
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Brand Story Tab */}
              {activeTab === 'story' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Brand Narrative & Story Sequence</h2>
                    <p className="text-mut text-sm mt-1">Edit the 3 sequential steps displayed in the sticky 3D scroll section.</p>
                  </div>

                  <div className="space-y-4">
                    {content.story.map((st, idx) => (
                      <div key={idx} className="bg-card border border-white/10 p-5 rounded-2xl space-y-3">
                        <span className="text-xs font-bold text-brand uppercase tracking-wider">Step {idx + 1}</span>
                        <div>
                          <label className="block text-xs text-mut mb-1">Giant Headline</label>
                          <input
                            type="text"
                            className="w-full text-xl font-extrabold"
                            value={st.headline}
                            onChange={e => {
                              const next = [...content.story];
                              next[idx].headline = e.target.value;
                              setContent({ ...content, story: next });
                            }}
                          />
                        </div>

                        <div>
                          <label className="block text-xs text-mut mb-1">Subtext / Explanation</label>
                          <textarea
                            rows={2}
                            className="w-full text-sm"
                            value={st.description}
                            onChange={e => {
                              const next = [...content.story];
                              next[idx].description = e.target.value;
                              setContent({ ...content, story: next });
                            }}
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Process Steps Tab */}
              {activeTab === 'process' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-bold text-white">4-Step Process Section</h2>
                    <p className="text-mut text-sm mt-1">Configure the progressive 4 steps displayed with the scaling dot indicators.</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {content.process.map((step, idx) => (
                      <div key={idx} className="bg-card border border-white/10 p-5 rounded-2xl space-y-3">
                        <span className="text-xs font-bold text-brand uppercase tracking-wider">Step #{idx + 1}</span>
                        <div>
                          <label className="block text-xs text-mut mb-1">Title</label>
                          <input
                            type="text"
                            className="w-full font-bold"
                            value={step.title}
                            onChange={e => {
                              const next = [...content.process];
                              next[idx].title = e.target.value;
                              setContent({ ...content, process: next });
                            }}
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-mut mb-1">Description</label>
                          <textarea
                            rows={3}
                            className="w-full text-sm"
                            value={step.description}
                            onChange={e => {
                              const next = [...content.process];
                              next[idx].description = e.target.value;
                              setContent({ ...content, process: next });
                            }}
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Posts / Articles Tab */}
              {activeTab === 'posts' && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-2xl font-bold text-white">Posts & What’s New</h2>
                      <p className="text-mut text-sm mt-1">Publish marketing trends, tips, and blog updates.</p>
                    </div>

                    <button
                      onClick={() => {
                        const newPost = {
                          id: 'post-' + Date.now(),
                          tag: 'Update',
                          title: 'New Industry Insight',
                          description: 'Key trend and strategy for modern scaling businesses.',
                          date: new Date().toISOString().slice(0, 10)
                        };
                        setContent({ ...content, posts: [newPost, ...content.posts] });
                      }}
                      className="bg-brand text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-opacity-90 flex items-center gap-1.5"
                    >
                      <span>+</span> New Post
                    </button>
                  </div>

                  <div className="space-y-4">
                    {content.posts.map((p, idx) => (
                      <div key={p.id || idx} className="bg-card border border-white/10 p-5 rounded-2xl space-y-3">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <input
                              type="text"
                              className="text-xs font-bold text-brand uppercase w-32"
                              value={p.tag}
                              onChange={e => {
                                const next = [...content.posts];
                                next[idx].tag = e.target.value;
                                setContent({ ...content, posts: next });
                              }}
                            />
                            <span className="text-xs text-mut">• {p.date || 'Recent'}</span>
                          </div>
                          <button
                            onClick={() => {
                              const next = content.posts.filter((_, i) => i !== idx);
                              setContent({ ...content, posts: next });
                            }}
                            className="text-xs text-red-400 hover:text-red-300 font-semibold"
                          >
                            Delete
                          </button>
                        </div>

                        <input
                          type="text"
                          className="w-full text-base font-bold"
                          value={p.title}
                          onChange={e => {
                            const next = [...content.posts];
                            next[idx].title = e.target.value;
                            setContent({ ...content, posts: next });
                          }}
                        />

                        <textarea
                          rows={2}
                          className="w-full text-sm"
                          value={p.description}
                          onChange={e => {
                            const next = [...content.posts];
                            next[idx].description = e.target.value;
                            setContent({ ...content, posts: next });
                          }}
                        />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Inquiries / Leads CRM Tab */}
              {activeTab === 'leads' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Inquiries & Leads (CRM Inbox)</h2>
                    <p className="text-mut text-sm mt-1">Audit requests submitted directly from the website contact form.</p>
                  </div>

                  <div className="space-y-4">
                    {(!content.inquiries || content.inquiries.length === 0) ? (
                      <div className="bg-card border border-white/10 p-10 text-center rounded-2xl">
                        <p className="text-mut text-base">No inquiries received yet.</p>
                      </div>
                    ) : (
                      content.inquiries.map((lead, idx) => (
                        <div key={lead.id || idx} className="bg-card border border-white/10 p-6 rounded-2xl space-y-4">
                          <div className="flex flex-wrap items-center justify-between gap-2 border-b border-white/10 pb-3">
                            <div>
                              <h3 className="text-lg font-bold text-white">{lead.name}</h3>
                              <p className="text-sm text-brand font-medium">{lead.business || 'No business specified'}</p>
                            </div>

                            <div className="flex items-center gap-3">
                              <span className="text-xs text-mut">{lead.date}</span>
                              <select
                                value={lead.status || 'New'}
                                onChange={e => {
                                  const next = [...content.inquiries];
                                  next[idx].status = e.target.value;
                                  setContent({ ...content, inquiries: next });
                                }}
                                className="text-xs font-semibold rounded-lg py-1 px-2.5"
                              >
                                <option value="New">🟡 New</option>
                                <option value="Contacted">🔵 Contacted</option>
                                <option value="Closed">🟢 Closed</option>
                              </select>

                              <button
                                onClick={() => {
                                  const next = content.inquiries.filter((_, i) => i !== idx);
                                  setContent({ ...content, inquiries: next });
                                }}
                                className="text-xs text-red-400 hover:text-red-300 font-semibold ml-2"
                              >
                                Delete
                              </button>
                            </div>
                          </div>

                          <div className="bg-white/[0.03] p-4 rounded-xl border border-white/5">
                            <span className="block text-xs font-bold uppercase tracking-wider text-mut mb-1">Message / Goal</span>
                            <p className="text-sm text-ink leading-relaxed">{lead.message || 'No message provided'}</p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}

              {/* Media Library Tab */}
              {activeTab === 'media' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Media Library</h2>
                    <p className="text-mut text-sm mt-1">Manage brand imagery and showreel video assets stored in public/assets/.</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div className="bg-card border border-white/10 p-5 rounded-2xl space-y-3">
                      <div className="aspect-video bg-[#0B0A0F] rounded-xl flex items-center justify-center p-4 border border-white/5">
                        <img src="./assets/logo.jpg" alt="Scalora Logo" className="max-h-16 w-auto" />
                      </div>
                      <div className="flex items-center justify-between">
                        <div>
                          <div className="text-sm font-bold text-white">logo.jpg</div>
                          <div className="text-xs text-mut">Header brand logo</div>
                        </div>
                        <span className="text-xs text-brand font-semibold">In Use</span>
                      </div>
                    </div>

                    <div className="bg-card border border-white/10 p-5 rounded-2xl space-y-3">
                      <div className="aspect-video bg-[#0B0A0F] rounded-xl flex items-center justify-center p-4 border border-white/5">
                        <img src="./assets/logo-footer.jpg" alt="Scalora Footer Logo" className="max-h-24 w-auto" />
                      </div>
                      <div className="flex items-center justify-between">
                        <div>
                          <div className="text-sm font-bold text-white">logo-footer.jpg</div>
                          <div className="text-xs text-mut">Footer brand emblem</div>
                        </div>
                        <span className="text-xs text-brand font-semibold">In Use</span>
                      </div>
                    </div>

                    <div className="bg-card border border-white/10 p-5 rounded-2xl space-y-3 sm:col-span-2">
                      <div className="aspect-video bg-[#0B0A0F] rounded-xl overflow-hidden border border-white/5">
                        <video controls className="w-full h-full object-cover">
                          <source src="./assets/showreel.mp4" type="video/mp4" />
                        </video>
                      </div>
                      <div className="flex items-center justify-between">
                        <div>
                          <div className="text-sm font-bold text-white">showreel.mp4 (~976 KB)</div>
                          <div className="text-xs text-mut">Main 3D Morphing Showreel Video</div>
                        </div>
                        <span className="text-xs text-brand font-semibold">In Use</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Site Settings Tab */}
              {activeTab === 'settings' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Global Site Settings</h2>
                    <p className="text-mut text-sm mt-1">Brand metadata, contact address, and theme settings.</p>
                  </div>

                  <div className="bg-card border border-white/10 p-6 rounded-2xl space-y-5">
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Website Title</label>
                      <input
                        type="text"
                        className="w-full text-base font-bold"
                        value={content.settings?.siteTitle || ''}
                        onChange={e => setContent({ ...content, settings: { ...content.settings, siteTitle: e.target.value } })}
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Meta Description</label>
                      <textarea
                        rows={2}
                        className="w-full text-sm"
                        value={content.settings?.siteDescription || ''}
                        onChange={e => setContent({ ...content, settings: { ...content.settings, siteDescription: e.target.value } })}
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Target SEO Keywords (Comma separated)</label>
                      <input
                        type="text"
                        className="w-full text-sm"
                        placeholder="digital presence, web design, social media agency, branding"
                        value={content.settings?.keywords || 'digital presence, web design agency, social media management, brand design, performance advertising, SEO, Scalora'}
                        onChange={e => setContent({ ...content, settings: { ...content.settings, keywords: e.target.value } })}
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Canonical Domain URL</label>
                        <input
                          type="url"
                          className="w-full text-sm font-mono"
                          value={content.settings?.canonicalUrl || 'https://scalora.agency/'}
                          onChange={e => setContent({ ...content, settings: { ...content.settings, canonicalUrl: e.target.value } })}
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Social Share Image (OG Image)</label>
                        <input
                          type="text"
                          className="w-full text-sm font-mono"
                          value={content.settings?.ogImage || '/assets/logo.jpg'}
                          onChange={e => setContent({ ...content, settings: { ...content.settings, ogImage: e.target.value } })}
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Admin / Contact Email</label>
                        <input
                          type="email"
                          className="w-full"
                          value={content.settings?.contactEmail || ''}
                          onChange={e => setContent({ ...content, settings: { ...content.settings, contactEmail: e.target.value } })}
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-mut mb-2">Brand Accent Color</label>
                        <div className="flex items-center gap-3">
                          <input
                            type="color"
                            className="w-12 h-11 p-1 bg-transparent cursor-pointer rounded-lg border border-white/20"
                            value={content.settings?.primaryColor || '#5C6CFF'}
                            onChange={e => setContent({ ...content, settings: { ...content.settings, primaryColor: e.target.value } })}
                          />
                          <input
                            type="text"
                            className="flex-1 font-mono text-sm"
                            value={content.settings?.primaryColor || '#5C6CFF'}
                            onChange={e => setContent({ ...content, settings: { ...content.settings, primaryColor: e.target.value } })}
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.render(<AdminApp />, document.getElementById('admin-root'));
  </script>
</body>
</html>
